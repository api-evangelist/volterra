aid: volterra
name: Volterra
description: >-
  Volterra was a Santa Clara-based distributed cloud company founded in 2017 by
  Ankur Singla, Harshad Nakil, and Ashish Ranjan, offering the VoltMesh
  (multi-cloud networking and security) and VoltStack (edge application
  deployment) SaaS platforms on a global application delivery network. Backed
  by roughly $50M from Khosla Ventures, Mayfield, M12, Samsung NEXT, and Itochu
  Technology Ventures, Volterra was acquired by F5 in January 2021 for
  approximately $500M and became the foundation of F5 Distributed Cloud
  Services. Its API surface (ves.io.schema, console.ves.volterra.io) is
  catalogued in the F5 Distributed Cloud Services profile, while the
  Volterra-branded Terraform provider and vesctl CLI remain published and
  maintained by F5.
